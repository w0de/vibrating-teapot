name: release

# Tag a commit `vX.Y.Z` and push it to cut a release with the extension tarball.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack extension
        run: |
          tar -czf vibrating-teapot.tar.gz \
            manifest.json background.js \
            options.html options.js \
            teapot.html teapot.js \
            icon.svg LICENSE README.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: vibrating-teapot.tar.gz
          generate_release_notes: true
          body: |
            ### Install (macOS / Linux)

            ```sh
            D="$HOME/.local/share/vibrating-teapot"; mkdir -p "$D" && curl -fsSL https://github.com/w0de/vibrating-teapot/releases/latest/download/vibrating-teapot.tar.gz | tar -xzf - -C "$D" && printf '%s' "$D/manifest.json" | (pbcopy 2>/dev/null || xclip -selection clipboard 2>/dev/null || xsel -ib 2>/dev/null || true) && echo "→ Load Temporary Add-on… and paste (now on your clipboard): $D/manifest.json" && { B="/Applications/Firefox.app/Contents/MacOS/firefox"; [ -x "$B" ] || B=firefox; "$B" "about:debugging#/runtime/this-firefox" >/dev/null 2>&1 & }
            ```

            ### Install (Windows, PowerShell)

            ```powershell
            $D="$env:LOCALAPPDATA\vibrating-teapot"; ni $D -ItemType Directory -Force | Out-Null; iwr https://github.com/w0de/vibrating-teapot/releases/latest/download/vibrating-teapot.tar.gz -OutFile "$env:TEMP\vt.tgz"; tar -xzf "$env:TEMP\vt.tgz" -C $D; "$D\manifest.json" | Set-Clipboard; Start-Process firefox "about:debugging#/runtime/this-firefox"; "→ Load Temporary Add-on… and paste (now on your clipboard): $D\manifest.json"
            ```

            Then click **Load Temporary Add-on…** and **paste** the `manifest.json` path it copied to your clipboard.
