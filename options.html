<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teapot</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #ffffff;
      --fg: #1c1c1e;
      --muted: #8a8a8e;
      --line: #e4e4e7;
      --accent: #34c759;
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --bg: #0e0e0e;
      --card: #1c1c1e;
      --fg: #f2f2f7;
      --muted: #8a8a8e;
      --line: #2c2c2e;
      --accent: #30d158;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 360px;
      padding: 22px 22px 18px;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    header svg { width: 26px; height: 26px; }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }
    .row {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 16px;
    }
    .row + .row { border-top: 1px solid var(--line); }
    .row .text { flex: 1; min-width: 0; }
    .row .title { font-weight: 500; }
    .row .desc { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

    /* macOS-style switch */
    .switch { position: relative; flex: none; width: 42px; height: 25px; }
    .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .track {
      position: absolute; inset: 0; border-radius: 999px;
      background: var(--line); transition: background .18s ease;
    }
    .track::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 21px; height: 21px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: transform .18s ease;
    }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(17px); }
    .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

    footer {
      margin-top: 14px; color: var(--muted); font-size: 11px;
      display: flex; align-items: center; gap: 6px;
    }
    footer code { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <header>
    <img src="icon.svg" alt="" width="26" height="26">
    <h1>Teapot</h1>
  </header>

  <div class="card">
    <label class="row" for="readerMode">
      <span class="text">
        <div class="title">Reader mode</div>
        <div class="desc">Open the snapshot stripped down to its text.</div>
      </span>
      <span class="switch">
        <input type="checkbox" id="readerMode" checked>
        <span class="track"></span>
      </span>
    </label>

    <label class="row" for="darkMode">
      <span class="text">
        <div class="title">Dark mode</div>
        <div class="desc">Dim these screens and the archived page.</div>
      </span>
      <span class="switch">
        <input type="checkbox" id="darkMode" checked>
        <span class="track"></span>
      </span>
    </label>
  </div>

  <footer>No snapshot pours a <code>418 I'm a teapot</code>.</footer>

  <script src="options.js"></script>
</body>
</html>
