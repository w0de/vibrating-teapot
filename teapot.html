<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>418 I'm a teapot</title>
  <style>
    :root {
      --bg: #f4f4f5; --fg: #1c1c1e; --muted: #8a8a8e; --accent: #0a84ff;
      color-scheme: light;
    }
    html[data-theme="dark"] {
      --bg: #0e0e0e; --fg: #f2f2f7; --muted: #8a8a8e; --accent: #409cff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: var(--bg); color: var(--fg);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; text-align: center; padding: 32px;
    }
    img.cat {
      width: min(440px, 80vw); height: auto;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .25);
    }
    .sub { color: var(--muted); max-width: 32rem; }
    .sub b { color: var(--fg); font-weight: 500; word-break: break-all; }
    a {
      color: var(--accent); text-decoration: none; font-weight: 500;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <img class="cat" src="https://http.cat/images/418.jpg" alt="418 — I'm a teapot">
  <p class="sub" id="sub">Nothing is archived yet.</p>
  <a id="brew" hidden>Brew a fresh snapshot &nearr;</a>

  <script src="teapot.js"></script>
</body>
</html>
